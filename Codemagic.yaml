workflows:
  android-apk:
    name: Countdown Android APK
    instance_type: linux_x2
    max_build_duration: 30

    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.example.countdownapp"

    scripts:
      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
